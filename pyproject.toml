description = "Open-source research on trustworthy autonomous multi-agent systems"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pytest>=8.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
