[project]
name = "trustworthy-agent-research"
version = "0.1.0"
description = "Open-source research on trustworthy autonomous multi-agent systems"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pytest>=8.0",
    "huggingface_hub>=0.30"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
